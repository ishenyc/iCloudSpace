name: Bug report
description: Report a reproducible problem
body:
  - type: markdown
    attributes:
      value: "Use invented data. Never include credentials, cookies, private email addresses or mailbox contents. Report security vulnerabilities privately."
  - type: input
    id: version
    attributes:
      label: Release and environment
      placeholder: Release tag, OS, Docker or native installation
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
